# =============================================================================
#  hyprtheme/skins/encre/skin.conf — the "encre" skin (ink & parchment)
# =============================================================================
#  Applied by hyprtheme/skin.sh apply encre: every KEY below is written to the
#  runtime toggles (~/.local/state/inkpaw/toggles.conf), so it overrides
#  hypr/settings.conf exactly like a change made in the settings window.
#  Your previous toggles + theme are saved first and come back with
#  skin.sh apply default.
#
#  The skin only changes the fonts, the look of the apps / menus (parchment
#  panels, ink outlines, cats) and the top bar. It keeps your colors and
#  wallpaper (no THEME= line: the encre themes encre-parchemin / encre-nuit
#  can still be picked by hand) and leaves the windows (borders, shadows,
#  rounding, gaps, blur, opacity) and the desktop cat to your own settings.
#  Every component reads UI_SKIN to pick its skinned style
#  (waybar preset, swaync / spotlight / quickpanel / … skin files).
# =============================================================================

UI_SKIN="encre"

# Fonts (bundled in hyprtheme/fonts, OFL)
FONT_FAMILY="Shantell Sans"
MONO_FONT="Courier Prime"
DISPLAY_FONT="Caveat Brush"
FONT_SIZE="12"

# Panels / menus: opaque paper, 3 px ink outline, round-ish corners
UI_RADIUS="16"
UI_BORDER="3"
UI_OPACITY="1.0"

# Terminal (kitty): the typewriter font of the mockups
KITTY_FONT="Courier Prime"

# Bar: ML4W layout (menu + clock | workspaces | status + system), paper plates
BAR_STYLE="encre"
BAR_POSITION="top"
BAR_LAYOUT="custom"
BAR_LEFT="time"
BAR_CENTER="session"
BAR_RIGHT="status system"
BAR_SINGLE_CAPSULE="false"
BAR_SESSION="workspaces"
BAR_TIME="launcher clock"
BAR_WORKSPACES_STYLE="numbers"
BAR_COLORED_ICONS="false"
BAR_FONT_SIZE="13"
BAR_MODULE_PADDING="9"
BAR_MARGIN="8"
BAR_RADIUS="16"
BAR_OPACITY="1.0"
