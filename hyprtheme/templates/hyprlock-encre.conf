# @output: hypr/skins/hyprlock-encre.conf
# =============================================================================
#  GENERATED by hyprtheme (template: hyprtheme/templates/hyprlock-encre.conf)
#  Lock screen of the "encre" skin (ink & parchment) — mockup Mew-Lock.
# =============================================================================
#  Used by hypr/scripts/lock.sh instead of hypr/hyprlock.conf when
#  UI_SKIN=encre (self-contained: colors, fonts and cat paths are baked in).
#  Layout (from the center of the screen, mockup 1440x900 px):
#    clock "HH:MM" (brush font, ochre offset shadow) · tilted date
#    ginger cat head in an ochre circle (ink border, hard shadow) · $USER
#    password card (ink border, hard shadow) with a grey 3-eyed cat sitting
#    on it, paws over its top edge · hint · footer chips battery/wifi/layout.
#  hyprlock font_size is in points (x1.33 = px): mockup px / 1.33.
#  Hard shadows = a plain ink shape drawn 4 px down-right under the widget
#  (hyprlock's own shadows are blurred). Draw order = zindex.
# =============================================================================

# --- palette (Material roles, see hyprtheme/skins/encre/README.md) -----------
$ink     = rgb({{colors.on_surface.default.hex_stripped}})
$shadow  = rgb({{colors.shadow.default.hex_stripped}})
$muted   = rgb({{colors.on_surface_variant.default.hex_stripped}})
$paper   = rgb({{colors.surface.default.hex_stripped}})
$veil    = rgba({{colors.surface.default.hex_stripped}}59)
$card    = rgb({{colors.surface_container_lowest.default.hex_stripped}})
$ochre   = rgb({{colors.primary_container.default.hex_stripped}})
$brick   = rgb({{colors.error.default.hex_stripped}})
$moss    = rgb({{colors.secondary_container.default.hex_stripped}})
$fur     = rgb(5c5a57)
$font    = {{ui.font}}
$display = {{ui.display_font}}
$mono    = {{ui.mono_font}}
$cats    = {{ui.skin_dir}}/cats
$logo    = {{ui.skin_dir}}/logo

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

# Blurred desktop (works with any wallpaper, even animated ones)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.95
    noise = 0.01
}

# Parchment veil over the whole screen (35 %)
shape {
    monitor =
    size = 10000, 10000
    color = $veil
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# --- Inkpaw mark, top-left (logo/inkpaw-mark-128.png: the tile carries its own paper)
image {
    monitor =
    path = $logo/inkpaw-mark-128.png
    size = 72
    rounding = 0
    border_size = 0
    position = 40, -36
    halign = left
    valign = top
    zindex = 2
}

# --- clock + date ------------------------------------------------------------
# ochre offset copy first, then the ink clock on top
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ochre
    font_size = 142
    font_family = $display
    position = 5, 250
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ink
    font_size = 142
    font_family = $display
    position = 0, 255
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] echo "<span weight='600'>$(date +'%A %-d %B')</span>"
    color = $ink
    font_size = 18
    font_family = $font
    rotate = 1.5
    position = 0, 148
    halign = center
    valign = center
    zindex = 2
}

# --- avatar: ginger cat head in an ochre circle ------------------------------
shape {
    monitor =
    size = 96, 96
    color = $shadow
    rounding = -1
    border_size = 0
    position = 4, -72
    halign = center
    valign = center
    zindex = 1
}
shape {
    monitor =
    size = 96, 96
    color = $ochre
    rounding = -1
    border_size = 3
    border_color = $ink
    position = 0, -68
    halign = center
    valign = center
    zindex = 2
}
image {
    monitor =
    path = $cats/head-moumoute.png
    size = 78
    rounding = 0
    border_size = 0
    position = 0, -68
    halign = center
    valign = center
    zindex = 3
}
label {
    monitor =
    text = $USER
    color = $ink
    font_size = 26
    font_family = $display
    position = 0, -147
    halign = center
    valign = center
    zindex = 2
}

# --- password card with the sitting cat --------------------------------------
# the cat's body sits behind the card (lower zindex), its paws over the edge
image {
    monitor =
    path = $cats/sit-gribouille.png
    size = 110
    rounding = 0
    border_size = 0
    position = 116, -195
    halign = center
    valign = center
    zindex = 1
}
shape {
    monitor =
    size = 420, 56
    color = $shadow
    rounding = 16
    border_size = 0
    position = 4, -264
    halign = center
    valign = center
    zindex = 2
}
input-field {
    monitor =
    size = 420, 56
    outline_thickness = 3
    outer_color = $ink
    inner_color = $card
    font_color = $ink
    font_family = $font
    check_color = $ochre
    fail_color = $brick
    capslock_color = $moss
    rounding = 16
    dots_text_format = 󰏩
    dots_size = 0.34
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground='##{{colors.on_surface_variant.default.hex_stripped}}'>mot de passe…</span>
    fail_text = <b>raté</b> ($ATTEMPTS)
    position = 0, -260
    halign = center
    valign = center
    zindex = 3
}
# lock icon at the left of the card
label {
    monitor =
    text = 󰌾
    color = $ink
    font_size = 15
    font_family = $font
    position = -180, -260
    halign = center
    valign = center
    zindex = 4
}
# two grey paws hanging over the top edge of the card
shape {
    monitor =
    size = 31, 21
    color = $fur
    rounding = -1
    border_size = 3
    border_color = $ink
    position = 94, -233
    halign = center
    valign = center
    zindex = 4
}
shape {
    monitor =
    size = 31, 21
    color = $fur
    rounding = -1
    border_size = 3
    border_color = $ink
    position = 138, -233
    halign = center
    valign = center
    zindex = 4
}

# hint
label {
    monitor =
    text = Entrée pour déverrouiller · le chat ne bougera pas
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, -311
    halign = center
    valign = center
    zindex = 2
}

# --- footer chips: battery · wifi · keyboard layout --------------------------
# fixed-size paper chips (hyprlock labels have no background): shadow + chip
shape {
    monitor =
    size = 120, 36
    color = $shadow
    rounding = 12
    border_size = 0
    position = -132, 30
    halign = center
    valign = bottom
    zindex = 1
}
shape {
    monitor =
    size = 120, 36
    color = $paper
    rounding = 12
    border_size = 3
    border_color = $ink
    position = -136, 34
    halign = center
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); echo "<b>󰁹  ${c:-AC}${c:+%}</b>"
    color = $ink
    font_size = 11
    font_family = $font
    position = -136, 41
    halign = center
    valign = bottom
    zindex = 3
}
shape {
    monitor =
    size = 180, 36
    color = $shadow
    rounding = 12
    border_size = 0
    position = 32, 30
    halign = center
    valign = bottom
    zindex = 1
}
shape {
    monitor =
    size = 180, 36
    color = $paper
    rounding = 12
    border_size = 3
    border_color = $ink
    position = 28, 34
    halign = center
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:30000] n=$(nmcli -t -f NAME,TYPE connection show --active 2>/dev/null | awk -F: '$2 ~ /wireless/ {print $1; exit}'); echo "<b>󰖩  $(printf '%.13s' "${n:-hors ligne}")</b>"
    color = $ink
    font_size = 11
    font_family = $font
    position = 28, 41
    halign = center
    valign = bottom
    zindex = 3
}
shape {
    monitor =
    size = 64, 36
    color = $shadow
    rounding = 12
    border_size = 0
    position = 168, 30
    halign = center
    valign = bottom
    zindex = 1
}
shape {
    monitor =
    size = 64, 36
    color = $paper
    rounding = 12
    border_size = 3
    border_color = $ink
    position = 164, 34
    halign = center
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:2000] hyprctl devices -j 2>/dev/null | jq -r '[.keyboards[] | select(.main)][0].active_keymap // "??"' | cut -c1-2 | tr '[:lower:]' '[:upper:]' | sed 's/^/<b>/; s/$/<\/b>/'
    color = $ink
    font_size = 11
    font_family = $mono
    position = 164, 41
    halign = center
    valign = bottom
    zindex = 3
}
