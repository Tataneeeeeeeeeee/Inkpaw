<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- =============================================================================
     hyprtheme/fonts/fonts.conf — the system font config + the fonts bundled in this folder
     =============================================================================
     Exported as FONTCONFIG_FILE by hypr/conf/env.lua, so every app started by
     the session sees the bundled fonts (OFL licensed, see each OFL.txt) without
     installing anything. Your own ~/.config/fontconfig is still read: the system
     file below includes it.
     ============================================================================= -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
</fontconfig>
