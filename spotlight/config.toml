# =============================================================================
#  spotlight/config.toml — sectioned Spotlight launcher (SUPER+SPACE)
# =============================================================================
#  One list of results, split by small titled separators, in the order of the
#  [[sections]] below. Delete / reorder blocks to change what is searched.
#
#  kind     = calc | apps | actions | files | web | run | clipboard
#  provider = Elephant provider used for that section (web & run are built in)
#  limit    = max rows in the section
#  prefix   = type it first to search ONLY that section (e.g. "/ notes")
#  prefix_limit = rows when searched through its prefix (default: limit)
#  only_with_prefix = true -> never shown in the mixed search
# =============================================================================

# Look: "hyde" = list card + slanted wallpaper picture on the right (HyDE launcher)
#       "classic" = one opaque card, picture on the left
style = "hyde"
# Sizes (px): height of the panel, width of the list ("hyde"), whole width ("classic")
height = 460
list_width = 420
width = 980
# Show the picture of the current wallpaper (generated by hyprtheme)
side_image = true
# Milliseconds to wait after the last key before searching
debounce_ms = 70
# Skin "encre" only (UI_SKIN, spotlight/skins/encre.css): the cat peeking over
# the list card — moumoute | gribouille | biscotte | pate | clafoutis | croquette | random
encre_cat = "moumoute"

[[sections]]
kind = "calc"
title = "Calculator"
provider = "calc"
limit = 1
prefix = "="

[[sections]]
kind = "apps"
title = "Applications"
provider = "desktopapplications"
limit = 6

[[sections]]
kind = "actions"
title = "Desktop actions"
provider = "menus"
limit = 3

[[sections]]
kind = "files"
title = "Files & folders"
provider = "files"
limit = 6
prefix = "/"

[[sections]]
kind = "emoji"
title = "Emoji"               # names are in English: "heart", "fire", "smile"…
provider = "symbols"
limit = 5
prefix = "."
prefix_limit = 20

[[sections]]
kind = "clipboard"
title = "Clipboard"
provider = "clipboard"
limit = 3                     # in the mixed search; ":" shows the whole history
prefix = ":"
prefix_limit = 15

[[sections]]
kind = "web"
title = "Web & maps"          # engines: elephant/websearch.toml (default = true ones)
limit = 4
prefix = "@"

[[sections]]
kind = "run"
title = "Command"
limit = 1
prefix = ">"
