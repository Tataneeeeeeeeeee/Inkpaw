# =============================================================================
#  theme.conf — settings of the SDDM theme "inkpaw-encre"
# =============================================================================
#  Read by Main.qml through SDDM's `config` object (config.<key>).
#  SDDM runs as its own user: every path below is RELATIVE to the theme folder
#  (/usr/share/sddm/themes/inkpaw-encre once installed), never /home.
#  Colors = the "encre-parchemin" palette of hyprtheme/skins/encre/README.md
#  (SDDM cannot read the project's templates, so the hex values live here).
#  Override without editing this file: theme.conf.user next to it.
# =============================================================================
[General]
# --- images (inside the theme folder) ---------------------------------------
# drawn by session/install.sh --sddm-theme (generate-wallpapers.sh, 14-ink-hills)
background=background.jpg
# parchment veil over the wallpaper (0 = none, 1 = opaque)
veilOpacity=0.2
# avatar shown in the ochre circle (ginger cat "moumoute")
avatar=cats/head-moumoute.png
# true = use the user's own ~/.face.icon when SDDM can read it, else the cat
useUserIcon=false
# cat sitting on the session card (calico "croquette")
sessionCat=cats/sit-croquette.png

# --- palette ------------------------------------------------------------------
# ink: text, outlines, hard shadows
ink="#2a2420"
# paper: panels
paper="#f1e7cf"
# card: raised surfaces (password field, radio dots)
card="#fffaf0"
# muted: secondary text
muted="#4a4038"
# ochre: fills for active/selected (ink text on top, never ochre text)
ochre="#d9a12e"
# brick: power / danger / error
brick="#c4573e"

# --- fonts (files in fonts/, loaded with FontLoader) ------------------------
fontBody=fonts/ShantellSans-Variable.ttf
fontDisplay=fonts/CaveatBrush-Regular.ttf
fontMono=fonts/CourierPrime-Bold.ttf

# --- texts / formats ----------------------------------------------------------
# Qt locale used for the date (day and month names)
locale=fr_FR
# Qt time / date formats
clockFormat=hh:mm
dateFormat=dddd d MMMM
# shown when the keyboard layout list is empty (e.g. Wayland greeter)
keyboardFallback=FR
# true = hide power buttons SDDM reports as unavailable
hideUnavailablePower=false
