# =============================================================================
#  hypr/hyprlock.conf — lock screen (hyprlock, hyprlang syntax)
# =============================================================================
#  Colors/font ($primary, $font…) come from hyprlock-colors.conf (GENERATED).
#  Background = blurred screenshot of your desktop (works with any wallpaper).
#  Launched by hypr/scripts/lock.sh (SUPER+L, idle, power menu).
# =============================================================================
# hyprlock-colors.conf is prepended by scripts/lock.sh (no `source` needed)

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    brightness = 0.55
    contrast = 0.9
    noise = 0.012
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 120
    font_family = $font
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 2
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $a1
    font_size = 22
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# User avatar (~/.face if present)
image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    border_size = 3
    border_color = $ring
    position = 0, -10
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $ring
    inner_color = $surface_high
    font_color = $on_surface
    check_color = $a5
    fail_color = $error
    fade_on_empty = false
    rounding = -1
    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -130
    halign = center
    valign = center
}

# Hint
label {
    monitor =
    text = 󰌾  Locked — $USER
    color = $on_surface_var
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
