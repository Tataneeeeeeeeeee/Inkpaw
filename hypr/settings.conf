# =============================================================================
#  settings.conf — THE single place for every user-tweakable value
# =============================================================================
#  Read by:
#    * Hyprland (hypr/lib/settings.lua parses this file)
#    * every shell script (they `source` it through hypr/scripts/lib.sh)
#    * the theming engine (fonts / radius are injected into every template)
#
#  Syntax: shell-compatible  KEY="value"  lines. Comments start with '#'.
#  Only $HOME and ${HOME} are expanded on the Lua side, so keep values simple.
#
#  Runtime toggles (animations, blur, gaps, gamemode, monitor profile) are
#  saved in ~/.local/state/inkpaw/toggles.conf and OVERRIDE these values.
# =============================================================================

# -----------------------------------------------------------------------------
# Applications
# -----------------------------------------------------------------------------
TERMINAL="kitty"
# Command prefix that runs a TUI in a floating terminal (class matched by a window rule)
TERMINAL_FLOAT="kitty --class floating-tui -e"
BROWSER="firefox"
FILEMANAGER="nautilus --new-window"
EDITOR_GUI="gnome-text-editor"
CALCULATOR="gnome-calculator"
# spotlight = sectioned list (spotlight/), walker = Walker
LAUNCHER="spotlight"
# Settings: app = settings window (libadwaita), rofi = rofi menu
SETTINGS_UI="app"
AUDIO_MIXER="pavucontrol"
BLUETOOTH_MANAGER="blueman-manager"

# Personal apps (bound in hypr/conf/keybinds/apps.lua)
APP_CHAT="discord"
APP_MUSIC="spotify-launcher"
APP_TEAMS="teams-for-linux"

# Terminal (kitty) — empty = keep the value of your own kitty.conf
KITTY_FONT=""
KITTY_FONT_SIZE=""
# 0.0 – 1.0 (1 = opaque)
KITTY_OPACITY=""
KITTY_PADDING=""
# block | beam | underline
KITTY_CURSOR=""

# File manager preferences — empty = leave as is
# true | false
FILES_SHOW_HIDDEN=""
# list | grid
FILES_VIEW=""

# -----------------------------------------------------------------------------
# Keyboard / input
# -----------------------------------------------------------------------------
MOD="SUPER"
KB_LAYOUT="fr"
KB_VARIANT=""
KB_OPTIONS="grp:alt_shift_toggle"
MOUSE_SENSITIVITY="0"
NATURAL_SCROLL="true"

# -----------------------------------------------------------------------------
# Monitors (see hypr/monitors/*.lua for the profiles)
# -----------------------------------------------------------------------------
MONITOR_LAPTOP="eDP-2"
MONITOR_EXTERNAL="HDMI-A-1"
# Where the external screen sits relative to the laptop: left | right | above | below
MONITOR_EXTERNAL_SIDE="right"
# Profile used until you pick one with the monitor menu: auto | extended | laptop-only | external-only | mirror
MONITOR_PROFILE="auto"
# Disable the laptop panel when the lid closes and an external screen is connected
LID_SWITCH_HANDLING="true"

# -----------------------------------------------------------------------------
# Look & feel (Hyprland)
# -----------------------------------------------------------------------------
GAPS_IN="6"
GAPS_OUT="12"
BORDER_SIZE="2"
BORDER_ANGLE="45"
# Slowly rotating gradient border (HyDE-style); small GPU cost
BORDER_ANIMATE="false"
ROUNDING="10"
ACTIVE_OPACITY="0.92"
INACTIVE_OPACITY="0.84"
BLUR="true"
BLUR_SIZE="7"
BLUR_PASSES="3"
SHADOW="true"
# soft = blurred drop shadow | hard = solid offset ink shadow (hand-drawn look)
SHADOW_STYLE="soft"
# Focused window border: gradient (3 accents) | ink (solid text color)
BORDER_STYLE="gradient"
ANIMATIONS="true"
# Animation preset file in hypr/conf/animations/ (without .lua): smooth | md3 | fast | none
ANIMATION_PRESET="smooth"
LAYOUT="dwindle"

CURSOR_THEME="Bibata-Modern-Ice"
CURSOR_SIZE="24"

# -----------------------------------------------------------------------------
# UI tokens (injected into Waybar / swaync / walker / rofi / wlogout templates)
# -----------------------------------------------------------------------------
# Text font (bar, menus, notifications, launcher, lock screen)
FONT_FAMILY="Google Sans Flex"
# Monospace font (Spotlight list, code)
MONO_FONT="JetBrainsMono Nerd Font"
# Icon font (Nerd Font glyphs used as fallback for icons)
ICON_FONT="CaskaydiaCove Nerd Font"
FONT_SIZE="12"
UI_RADIUS="12"
UI_BORDER="1"
# Background opacity of bars / panels (0.0 – 1.0)
UI_OPACITY="0.72"
# Title font (big headings, workspace numbers in skinned looks); empty = FONT_FAMILY
DISPLAY_FONT=""

# Interface style ("skin"): default | encre (ink & parchment, hand-drawn, cats).
# It only changes the fonts, the look of the apps / menus and the top bar:
# colors, wallpaper, window borders / shadows / gaps and the desktop cat stay yours.
# Change it with  hyprtheme/skin.sh apply <name>  (or Settings → Appearance):
# the skin writes its own fonts / bar / borders (hyprtheme/skins/<name>/skin.conf)
# and the previous values come back with  skin.sh apply default.
UI_SKIN="default"
# Cat peeking from the bottom of the screen (deskpet/), click it to hear it
DESKTOP_PET="false"
# moumoute | gribouille | biscotte | pate | clafoutis | croquette
DESKTOP_PET_CAT="gribouille"

# -----------------------------------------------------------------------------
# Bar (Waybar) — everything here can also be changed from the settings menu
# (SUPER+CTRL+S → Bar). The config is generated by waybar/build.py.
# -----------------------------------------------------------------------------
# top | bottom
BAR_POSITION="top"
# Monitors showing the bar: "*" = all, or names separated by spaces ("eDP-2 HDMI-A-1")
BAR_OUTPUTS="*"
# Where the capsules go: center (all in the middle) | split (session left,
# clock center, status+system right) | left | right | custom (BAR_LEFT/CENTER/RIGHT)
BAR_LAYOUT="center"
BAR_LEFT="session"
BAR_CENTER="time"
BAR_RIGHT="status system"
# true = put every capsule inside ONE single pill (thin separators between groups)
BAR_SINGLE_CAPSULE="false"
# Look: capsules (floating pills) | floating (one rounded bar) | solid (edge to edge) | minimal (no backgrounds)
#       | hyde (thin dark strip with small bordered capsules, HyDE / hyprdots look)
#       | encre (parchment plates, ink outline, hard shadow — the "encre" skin)
BAR_STYLE="capsules"
# Capsule contents (module names from waybar/catalog.tsv), in display order
BAR_SESSION="launcher workspaces taskbar"
BAR_TIME="clock"
BAR_STATUS="extras media sound network bluetooth battery"
BAR_SYSTEM="updates ai notifications settings power"
# Modules hidden in the hover drawer ("extras")
BAR_EXTRAS="tray caffeine wallpaper brightness"
# Workspaces: dots | numbers
BAR_WORKSPACES_STYLE="dots"
BAR_WORKSPACES_COUNT="5"
# Clock (strftime; L = localized names)
BAR_CLOCK_FORMAT="%a %d %b   %H:%M"
# Show numbers next to the sound / battery / brightness icons
BAR_SHOW_PERCENT="true"
# One accent color per module (false = monochrome icons)
BAR_COLORED_ICONS="true"
# Sizes (px). BAR_HEIGHT=0 = automatic
BAR_HEIGHT="0"
BAR_MARGIN="6"
BAR_FONT_SIZE="12"
# Space around each module, horizontally (wider bar = bigger value)
BAR_MODULE_PADDING="13"
BAR_RADIUS="9"
# Background opacity of the capsules / bar (0.0 – 1.0)
BAR_OPACITY="0.82"
# "updates" module: minutes between two checks; show a check mark when up to
# date (false = the button only appears when updates are pending)
UPDATES_INTERVAL="30"
UPDATES_SHOW_ZERO="false"

# -----------------------------------------------------------------------------
# Wallpaper & theming
# -----------------------------------------------------------------------------
WALLPAPER_DIR="$HOME/Pictures/wallpapers"
# dark | light
THEME_MODE="dark"
# matugen scheme: scheme-tonal-spot | scheme-content | scheme-expressive | scheme-fidelity | scheme-vibrant | ...
MATUGEN_SCHEME="scheme-vibrant"
# Accent colors: wallbash = tone-on-tone with the wallpaper (HyDE look)
#                rainbow  = 6 different hues (more colorful)
ACCENT_STYLE="wallbash"
# Which color to pick when an image has several candidates:
# saturation | less-saturation | darkness | lightness | value
MATUGEN_PREFER="saturation"
# Static theme used when no wallpaper has ever been picked (hyprtheme/static/*.json)
DEFAULT_STATIC_THEME="catppuccin-mocha"
# awww / swww transition
WALLPAPER_TRANSITION="grow"
WALLPAPER_TRANSITION_DURATION="1.2"
WALLPAPER_TRANSITION_FPS="60"

# -----------------------------------------------------------------------------
# Screenshots
# -----------------------------------------------------------------------------
SCREENSHOT_DIR="$HOME/Pictures/Screenshots"
# OCR languages for the text extractor (tesseract codes, '+' separated)
OCR_LANG="fra+eng"

# -----------------------------------------------------------------------------
# AI assistant (chat side panel: bar 󰚩, SUPER+I) — API keys are NOT stored
# here: set them in Settings → AI assistant (saved in the state dir, mode 600)
# -----------------------------------------------------------------------------
# claude | openai | ollama | openrouter | custom (any OpenAI-compatible endpoint)
AI_PROVIDER="claude"
AI_MODEL="claude-opus-5-5"
# Claude thinking effort: low (fast chat) | medium | high | xhigh | max
AI_EFFORT="low"
# Endpoint for openai / ollama / openrouter / custom (empty = provider default)
AI_BASE_URL=""
# Panel: right | left, width in px
AI_SIDE="right"
AI_WIDTH="420"
# Extra instructions for the assistant (empty = short built-in default)
AI_SYSTEM_PROMPT=""

# -----------------------------------------------------------------------------
# Battery alerts (hypr/scripts/battery-alert.sh)
# -----------------------------------------------------------------------------
# Laptop battery levels (%) that send a notification; the lowest one is critical
BATTERY_ALERT_LEVELS="20 10 5"
# Mouse / headset / keyboard… battery level (%) that sends a notification
DEVICE_ALERT_LEVEL="15"

# -----------------------------------------------------------------------------
# Idle management (seconds; 0 disables a step)
# -----------------------------------------------------------------------------
IDLE_AC_DIM="480"
IDLE_AC_LOCK="600"
IDLE_AC_DPMS="660"
IDLE_AC_SUSPEND="1800"

IDLE_BAT_DIM="120"
IDLE_BAT_LOCK="300"
IDLE_BAT_DPMS="330"
IDLE_BAT_SUSPEND="600"
