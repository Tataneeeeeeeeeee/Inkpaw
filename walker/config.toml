# =============================================================================
#  walker/config.toml — Spotlight-style launcher (Walker 2.x + Elephant)
# =============================================================================
#  Search providers are Elephant plugins (one AUR package each, see README).
#  * providers.default  = what you get when you just type (SUPER+SPACE)
#  * providers.prefixes = type the prefix first to search a single provider
#  Comment a line to disable a provider. Per-provider options live in
#  ~/.config/elephant/<provider>.toml (see elephant/).
#  Look: themes/inkpaw/ (colors.css is generated by hyprtheme).
# =============================================================================

theme = "inkpaw"
force_keyboard_focus = true
close_when_open = true          # pressing the shortcut again closes it
click_to_close = true
selection_wrap = true
hide_action_hints = false

[placeholders]
"default" = { input = "Search apps, files, web, maps, math…   (/ files · @ web · : clipboard · . emoji)", list = "No results" }

[providers]
max_results = 40
# Searched together when no prefix is typed. Each result shows a colored
# CATEGORY badge (APP · FILE · WEB/MAP · CALC · ACTION · RUN), see the
# item_<provider>.xml templates in themes/inkpaw/.
default = [
    "calc",
    "desktopapplications",
    "menus",
    "files",
    "websearch",
    "runner",
]
# Shown when the query is empty
empty = ["desktopapplications"]

# Keep every category short so they all fit on screen
[providers.max_results_provider]
calc = 1
desktopapplications = 6
menus = 3
files = 5
websearch = 3
runner = 1

# Single-provider prefixes ----------------------------------------------------
[[providers.prefixes]]
prefix = ";"
provider = "providerlist"       # list every provider

[[providers.prefixes]]
prefix = "/"
provider = "files"              # file search

[[providers.prefixes]]
prefix = "="
provider = "calc"               # calculator (qalc syntax, units, currencies)

[[providers.prefixes]]
prefix = "@"
provider = "websearch"          # web search engines from elephant/websearch.toml

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"          # clipboard history (text + images)

[[providers.prefixes]]
prefix = ">"
provider = "runner"             # run any shell command

[[providers.prefixes]]
prefix = "."
provider = "symbols"            # emoji & symbols
